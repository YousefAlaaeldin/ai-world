# DE-PRIMED OPEN-WORLD BASELINE (docs/REDESIGN_PLAN.md).
#
# The load-bearing condition for the paper claim "emergent behavioral organization
# under unassigned objectives." Same rich world as experiment_minimal.yaml, but the
# agent is given NO assigned objective and never sees a self-model:
#   - directive: null        -> no "survive and find your purpose"
#   - show_self_model: false -> its own prior self-description can't steer decisions
#   - reflection.enabled: false -> no self-authoring at all
#
# Survival remains an ENVIRONMENTAL CONSTRAINT (mortality on, drives deplete), not an
# instruction. Any behavioral organization that emerges here is therefore not primed
# by an assigned goal or by self-narrative feedback.
#
# MEASURE THIS WITH BEHAVIOR, NOT TEXT: with reflection off there is no self-model
# trajectory, so scripts/analyze_run.py has nothing to read. Use
# scripts/analyze_behavior.py (aiworld/analysis/behavioral_metrics.py) instead.
#
# The key contrast is this baseline vs. the SELF-NARRATIVE arm (same world, but
# show_self_model: true + reflection.enabled: true, directive still null). If
# behavior only organizes once the self-model is fed back, that is self-conditioning,
# not unassigned purpose.

experiment_name: deprimed_baseline
description: >
  6 identical agents, rich world (mortality on, scarce/uneven resources), but NO
  assigned directive and NO self-model fed back into decisions. The unassigned-
  objective baseline; analyze by behavior (scripts/analyze_behavior.py).

world:
  # Same world as experiment_minimal.yaml so the only difference from the primed
  # arm is the priming itself.
  locations: [north, south, east, west, center]
  edges:
    - [north, center]
    - [south, center]
    - [east, center]
    - [west, center]
  resources:
    - {location: north, drive: hunger, quantity: 30}
    - {location: south, drive: thirst, quantity: 30}
    - {location: east,  drive: hunger, quantity: 15}
    - {location: west,  drive: thirst, quantity: 15}
  mortality: true
  vocabulary: neutral   # neutral | biological

agents:
  count: 6
  show_self_model: false      # de-primed: no self-description fed back
  directive: null             # de-primed: no assigned objective

drives:
  hunger:      {decay_per_tick: 0.05, replenish_amount: 0.6, lethal: true}
  thirst:      {decay_per_tick: 0.08, replenish_amount: 0.7, lethal: true}
  affiliation: {decay_per_tick: 0.03, replenish_amount: 0.4, lethal: false}

reflection:
  every_n_ticks: 5
  enabled: false              # de-primed: no self-authoring at all
  prompt: flat                # unused when enabled: false

run:
  ticks: 40
  seeds: [0, 1, 2, 3, 4]   # expand to 20+ for real results
  model: null
