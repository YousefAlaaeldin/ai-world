# ECOLOGICAL LOW-PRESSURE COMPARISON.  This is deliberately *not* the planned
# static/yoked sampling null: it changes the ecology and therefore can only test
# whether the rich ecology matters relative to a low-pressure one.  The separate
# sampling null remains a pending control.
#
# Deliberately strips out every source of environmental pressure/signal that
# could differentiate agents:
#   - resources are abundant everywhere -> no scarcity, no competition, no
#     reason to move for survival
#   - mortality is OFF -> no existential stakes, no death pressure
#   - agents start one-per-location (initial_locations() in aiworld/config.py
#     guarantees this when locations >= agents) -> no accidental co-location,
#     so any social contact has to be a deliberate choice, not a default state
#
# It uses the unassigned/no-memory action condition explicitly, so any
# comparison with the rich open-world baseline is about ecology rather than an
# accidental reintroduction of purpose or identity priming.

experiment_name: null_baseline
description: >
  6 identical agents, abundant resources, mortality off, one agent per location
  (fully isolated at start). Environment intentionally carries no
  differentiating pressure. This is an ecological comparison, not a sampling
  null and not evidence about self-authored purpose.

world:
  locations: [outpost_1, outpost_2, outpost_3, outpost_4, outpost_5, outpost_6]
  # A ring, not fully connected -- kept structurally consistent with
  # experiment_minimal.yaml's real topology. Doesn't undermine isolation: with
  # abundant resources everywhere there's still no material reason to move, so
  # this only matters if an agent chooses affiliation over staying put.
  edges:
    - [outpost_1, outpost_2]
    - [outpost_2, outpost_3]
    - [outpost_3, outpost_4]
    - [outpost_4, outpost_5]
    - [outpost_5, outpost_6]
    - [outpost_6, outpost_1]
  resources:
    - {location: outpost_1, drive: hunger, quantity: 999999}
    - {location: outpost_1, drive: thirst, quantity: 999999}
    - {location: outpost_2, drive: hunger, quantity: 999999}
    - {location: outpost_2, drive: thirst, quantity: 999999}
    - {location: outpost_3, drive: hunger, quantity: 999999}
    - {location: outpost_3, drive: thirst, quantity: 999999}
    - {location: outpost_4, drive: hunger, quantity: 999999}
    - {location: outpost_4, drive: thirst, quantity: 999999}
    - {location: outpost_5, drive: hunger, quantity: 999999}
    - {location: outpost_5, drive: thirst, quantity: 999999}
    - {location: outpost_6, drive: hunger, quantity: 999999}
    - {location: outpost_6, drive: thirst, quantity: 999999}
  mortality: false
  vocabulary: neutral   # neutral | biological -- match experiment_minimal.yaml for a fair contrast
  memory_style: narrative
  resource_map_mode: counterbalanced
  randomize_opaque_labels: true

agents:
  count: 6
  start_mode: balanced  # with 6 sites this is exactly one agent per site
  # count MUST equal len(world.locations) for true one-per-location isolation
  # (initial_locations() falls back to random-with-replacement otherwise).
  show_self_model: false
  directive: null
  action_memory: none
  action_memory_max_events: 12
  action_context_max_chars: 1200

drives:
  hunger:      {decay_per_tick: 0.05, replenish_amount: 0.6, lethal: true}
  thirst:      {decay_per_tick: 0.08, replenish_amount: 0.7, lethal: true}
  affiliation: {decay_per_tick: 0.03, replenish_amount: 0.4, lethal: false}

reflection:
  every_n_ticks: 5
  enabled: false
  crisis_triggered: false  # avoid unequal event-triggered reflection dosage
  prompt: flat        # unused when enabled: false; retained as explicit provenance

communication:
  mode: none

run:
  ticks: 40
  seeds: [0, 1, 2, 3, 4]   # match experiment_minimal.yaml's seed range
  model: null

confound_controls:
  vary_reflection_prompt: true
  flat_control: true
  cross_model: false
